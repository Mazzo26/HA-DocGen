name: Feature request
description: Suggest an enhancement for HA-DocGen
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want to solve and the enhancement you propose.

        Check the [roadmap](https://github.com/Mazzo26/HA-DocGen/blob/main/docs/roadmap.md) before submitting overlapping work.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should HA-DocGen behave after this change?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered, if any.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project is most affected?
      options:
        - Analysis / scanning
        - Documentation generation
        - Validation
        - Reporting
        - CLI
        - Packaging / release
        - Documentation / repository
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Examples, references, or related issues.
    validations:
      required: false
