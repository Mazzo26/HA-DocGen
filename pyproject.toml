[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-docgen"
dynamic = ["version"]
description = "Enterprise-grade documentation generator for Home Assistant"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alex Wolff" },
]
keywords = [
    "home-assistant",
    "documentation",
    "documentation-generator",
    "yaml",
    "inventory",
    "home-automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "PyYAML",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/Mazzo26/HA-DocGen"
Repository = "https://github.com/Mazzo26/HA-DocGen"
Issues = "https://github.com/Mazzo26/HA-DocGen/issues"

[project.scripts]
ha-docgen = "ha_docgen.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ha_docgen*"]
namespaces = false

[tool.setuptools.dynamic]
version = { attr = "ha_docgen.version.VERSION" }
